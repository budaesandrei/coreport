[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coreport-backend"
version = "0.1.0"
description = "Coreport backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "ruff>=0.9.0",
  "pytest>=8.0",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "openai>=1.40.0",
  "tenacity>=8.2",
  "orjson>=3.10",
  "openpyxl>=3.1",
  "mangum>=0.17",
  "pyjwt>=2.8",
  "passlib[bcrypt]>=1.7.4",
  "python-slugify>=8.0",
  "email-validator>=2.1",
  "python-jose>=3.3",
  "bcrypt<4",
]


[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
