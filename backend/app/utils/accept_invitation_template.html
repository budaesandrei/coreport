<html>
  <body style="margin:0; padding:0; font-family: Arial, sans-serif; background-color: #f5f6fa;">
    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #f5f6fa; padding: 40px 0;">
      <tr>
        <td align="center">
          <table width="600" cellpadding="0" cellspacing="0" border="0" style="background-color: #ffffff; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); overflow: hidden;">
            <!-- Logo -->
            <tr>
              <td align="center" style="padding: 30px 0 20px;">
                <img src="https://i.imgur.com/4ygDpw8.png" alt="Coreport Logo" width="120" style="display:block;">
              </td>
            </tr>

            <!-- Greeting -->
            <tr>
              <td style="padding: 0 40px;">
                <p style="font-size: 16px; color: #333333;">Hello <strong>${first_name}</strong>,</p>
                <p style="font-size: 16px; color: #333333;">Greetings from <strong>Coreport.co</strong>!</p>
                <p style="font-size: 16px; color: #333333;">
                  You have been invited to join the <strong>${project_name}</strong> project. Please accept the invitation by clicking the button below:
                </p>
              </td>
            </tr>

            <!-- CTA Button -->
            <tr>
              <td align="center" style="padding: 20px 40px;">
                <a href="${link}" style="background-color: #306c75; color: #ffffff; text-decoration: none; padding: 12px 24px; border-radius: 6px; font-size: 16px; display: inline-block;">
                  Accept Invitation
                </a>
              </td>
            </tr>

            <!-- Footer note -->
            <tr>
              <td style="padding: 0 40px 30px;">
                <p style="font-size: 14px; color: #999999;">
                  This link will expire soon. If you did not expect this email, you can safely ignore it.
                </p>
              </td>
            </tr>
          </table>

          <!-- Footer spacing -->
          <table width="600">
            <tr><td style="height: 40px;"></td></tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
