services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: coreport
      POSTGRES_PASSWORD: coreport
      POSTGRES_DB: coreport
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coreport -d coreport"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      ENV: dev
      DATABASE_URL: postgresql+asyncpg://coreport:coreport@postgres:5432/coreport
      CORS_ORIGINS: http://localhost:3000
      FILE_STORAGE_PATH: /data/storage
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      SIGNED_URL_SECRET: ${SIGNED_URL_SECRET:-dev-secret-change-me}
      STORE_LLM_TRACES: ${STORE_LLM_TRACES:-true}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-no-reply@coreport.local}
    volumes:
      - ./backend:/app
      - storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
    ports:
      - "8000:8000"

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
  storage:
